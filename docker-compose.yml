volumes:
  db_data: {}

services:

  db:
    image: mariadb:11
    container_name: mariadb
    environment:
      MARIADB_DATABASE: contacts
      MARIADB_USER: user
      MARIADB_PASSWORD: userpassword
      MARIADB_ROOT_PASSWORD: rootpassword
    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql
#    ports:
#      - "3306:3306"

  contact:
    container_name: contact
    build:
      context: .
      dockerfile: contacts-backend/Dockerfile
      args:
        MODULE_NAME: contact
    image: contact
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - backend

  icon-handling:
    container_name: icon-handling
    build:
      context: .
      dockerfile: contacts-backend/Dockerfile
      args:
        MODULE_NAME: icon-handling
    image: icon-handling
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - ./contacts-backend/icon-handling/icons:/app/icons:Z

  nginx:
    container_name: contacts-nginx
    image: nginx:latest
    ports:
      - "${BE_PORT_EXTERNAL}:${NGINX_PORT_LISTENING}"
    env_file: .env
    volumes:
      - ./contacts-backend/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro,Z
    depends_on:
      - contact
      - icon-handling
    networks:
      - backend

  frontend:
    container_name: contacts-frontend
    build:
      context: .
      dockerfile: contacts-frontend-js/Dockerfile
      args:
        CONTACT_API: ${CONTACT_API}
        CONTACT_HOST: ${BE_HOST_PORTLESS_EXTERNAL}:${BE_PORT_EXTERNAL}
        ICON_HANDLING_API: ${ICON_HANDLING_API}
        ICON_HANDLING_HOST: ${BE_HOST_PORTLESS_EXTERNAL}:${BE_PORT_EXTERNAL}
    ports:
      - "1024:${FRONTEND_PORT_LISTENING}"
    restart: unless-stopped


networks:
  backend:
    driver: bridge
